name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build must succeed without real secrets
          DATABASE_URL: "postgresql://user:pass@localhost:5432/ghostmail?sslmode=require"
          EMAIL_DOMAIN: ""

  # Optional: real PostgreSQL concurrency tests (Neon test branch only).
  # neon-http requires a Neon connection string — a generic Postgres service is not sufficient.
  # Set repository secret RATE_LIMIT_TEST_DATABASE_URL to a dedicated Neon branch URL.
  rate-limit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run when the secret is configured (GitHub still injects empty string if missing)
    if: ${{ vars.RUN_RATE_LIMIT_INTEGRATION == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run rate-limit integration tests
        env:
          RATE_LIMIT_TEST_DATABASE_URL: ${{ secrets.RATE_LIMIT_TEST_DATABASE_URL }}
        run: |
          if [ -z "$RATE_LIMIT_TEST_DATABASE_URL" ]; then
            echo "RATE_LIMIT_TEST_DATABASE_URL secret is empty — failing job"
            exit 1
          fi
          npm run test -- tests/rate-limit.integration.test.ts
